name: democracy
description: A politically neutral, source-first local democracy data app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  cupertino_icons: ^1.0.9
  cupertino_native_better: ^1.5.4
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  go_router: ^17.3.0
  liquid_glass_widgets: ^0.29.5
  native_liquid_glass: ^0.2.14
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Sample payloads only. No fonts are declared: Archivo and Pretendard have
    # no files or licence terms confirmed yet, so the app falls back to the
    # system face on purpose.
    - assets/fixtures/
