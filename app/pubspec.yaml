name: democracy
description: A politically neutral, source-first local democracy data app.
publish_to: "none"
version: 0.2.2+4

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  cupertino_native_better: ^1.5.4
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  gotrue: ^2.27.2
  kakao_flutter_sdk_user: ^2.0.1
  liquid_glass_widgets: ^0.29.5
  local_auth: ^3.0.2
  native_liquid_glass: ^0.2.14
  path_provider: ^2.1.6
  realtime_client: ^2.13.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Store screenshots (integration_test/store_screenshots_test.dart).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Sample payloads only.
    - assets/fixtures/
    # Read by the licence registry at startup, not drawn.
    - assets/fonts/gowun_batang/OFL.txt
    - assets/fonts/nanum_pen_script/OFL.txt

  # Both OFL. Body text stays on the system face; see AppFonts.
  fonts:
    - family: GowunBatang
      fonts:
        - asset: assets/fonts/gowun_batang/GowunBatang-Regular.ttf
        - asset: assets/fonts/gowun_batang/GowunBatang-Bold.ttf
          weight: 700
    - family: NanumPenScript
      fonts:
        - asset: assets/fonts/nanum_pen_script/NanumPenScript-Regular.ttf
