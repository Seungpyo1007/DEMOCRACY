name: verify

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**"]

# A superseded run on the same branch has nothing left to prove.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      # tool/bootstrap.ps1 refuses to run on anything but 3.44.8. CI applies the
      # same rule, so a drifting toolchain fails here rather than producing a
      # green run that nobody could reproduce locally.
      - name: Confirm the pinned toolchain
        working-directory: .
        run: |
          flutter --version --machine > version.json
          cat version.json
          jq -e '.frameworkVersion == "3.44.8"' version.json > /dev/null
          jq -e '.dartSdkVersion | startswith("3.12.2")' version.json > /dev/null

      - name: Resolve dependencies
        run: flutter pub get

      # --set-exit-if-changed, unlike the local bootstrap, which rewrites in
      # place. CI reports unformatted code instead of quietly fixing it.
      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      # The goldens are generated on macOS and compared byte for byte, so this
      # runner cannot judge them. The golden job below does.
      - name: Test
        run: flutter test --exclude-tags golden

  golden:
    name: golden (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Confirm the pinned toolchain
        working-directory: .
        run: |
          flutter --version --machine > version.json
          cat version.json
          jq -e '.frameworkVersion == "3.44.8"' version.json > /dev/null
          jq -e '.dartSdkVersion | startswith("3.12.2")' version.json > /dev/null

      - name: Resolve dependencies
        run: flutter pub get

      # Rasterisation differs between macOS and Linux, which is why this job
      # exists at all. TZ is fixed for the same reason the images are: the
      # source badges render "○월 ○일 기준" in local time, so a runner in
      # another zone would disagree with the committed pixels.
      - name: Golden
        run: TZ=UTC flutter test --tags golden
